[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set in Netlify UI → Site configuration → Environment variables:
  # FORMSPREE_CONTACT_ID = your Formspree contact form ID
  # FORMSPREE_NEWSLETTER_ID = your Formspree newsletter form ID

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
