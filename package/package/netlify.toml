[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Contact form: Netlify Forms (see Forms in Netlify dashboard).
  # Email notifications: Site configuration → Notifications → Form submission notifications.
  # Note: info@imusafir.com requires GoDaddy/Microsoft email + MX records on the domain.

[[redirects]]
  from = "/pricing.html"
  to = "/indonesia-2026.html"
  status = 302

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
